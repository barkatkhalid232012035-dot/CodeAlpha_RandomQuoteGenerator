<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Quote Generator — CodeAlpha Internship</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💬</text></svg>">
</head>
<body>

  <!-- App Header -->
  <header class="app-header">
    <div>
      <span class="brand-badge">CodeAlpha Internship • Task 2</span>
      <h1 class="brand-title">Random Quote Generator</h1>
    </div>
    <div>
      <button id="btnOpenFavorites" class="btn-favorites-drawer" title="View Bookmarked Quotes">
        <span>❤️ Saved Quotes</span>
      </button>
    </div>
  </header>

  <!-- Category Pills Filter Bar -->
  <nav class="category-filter-bar" id="categoryFilters" aria-label="Quote categories"></nav>

  <!-- Main Container -->
  <main class="app-container">

    <!-- Quote Card -->
    <article class="quote-card" id="quoteCard">
      <div class="quote-decor-mark" aria-hidden="true">“</div>

      <!-- Card Top: Category and Favorite Toggle -->
      <div class="quote-header-info">
        <span id="quoteCategory" class="quote-category-tag">General</span>
        <button id="btnFavToggle" class="btn-fav-toggle" aria-label="Save quote to favorites" title="Save to favorites">
          🤍
        </button>
      </div>

      <!-- Quote Body -->
      <blockquote class="quote-content" id="quoteText">
        Loading inspirational quote...
      </blockquote>

      <!-- Author Attribution -->
      <div class="quote-author-wrapper">
        <div class="author-dash" aria-hidden="true"></div>
        <cite id="quoteAuthor" class="quote-author">Author Name</cite>
      </div>

      <!-- Actions Row -->
      <div class="quote-actions-row">
        <div class="utility-buttons">
          <button id="btnCopy" class="btn-icon" title="Copy quote to clipboard" aria-label="Copy quote">
            <span>📋 Copy</span>
          </button>
          <button id="btnTweet" class="btn-icon" title="Share quote on X / Twitter" aria-label="Share on Twitter">
            <span>𝕏 Share</span>
          </button>
        </div>

        <button id="btnNewQuote" class="btn-new-quote" aria-label="Fetch next random quote">
          <span>✨ New Quote</span>
        </button>
      </div>
    </article>

  </main>

  <!-- Favorites Modal -->
  <div id="favoritesModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="favModalTitle">
    <div class="modal-dialog">
      <div class="modal-header">
        <h2 id="favModalTitle" class="modal-title">Saved Quotes</h2>
        <button id="btnCloseFavorites" class="modal-close-btn" aria-label="Close modal">&times;</button>
      </div>
      <div class="modal-body" id="favoritesList">
        <!-- Rendered dynamically -->
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toastContainer" class="toast-container" aria-live="polite"></div>

  <!-- Footer -->
  <footer class="app-footer">
    <p>CodeAlpha App Development Internship &bull; Professional Project Deliverable &bull; Clean & Minimal UI</p>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
